name: Update Landscape
on:
  push:
    paths:
      - 'project.yaml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Update Landscape
        uses: cncf/automation/.github/actions/landscape-update@9200f947dd422a13b58c648baa71389181b37406
        with:
          project_file: 'project.yaml'
          token: ${{ secrets.LANDSCAPE_REPO_TOKEN }}
